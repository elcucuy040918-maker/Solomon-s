<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOMON'S - 상세 토론</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#3B82F6', accent: '#EF4444', darkbg: '#0A0D14', cardbg: '#121722' },
          fontFamily: { sports: ['Oswald', 'Noto Sans KR', 'sans-serif'], sans: ['Noto Sans KR', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0A0D14] text-gray-100 min-h-screen font-sans antialiased flex flex-col justify-between">

  <!-- 헤더 -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0A0D14]/90 border-b border-gray-800/80">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='index.html'">
        <span class="font-sports-title text-3xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-red-500 uppercase">
          SOLOMON'S
        </span>
      </div>
      <button onclick="location.href='index.html'" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> 목록으로 돌아가기
      </button>
    </div>
  </header>

  <!-- 상세 내용 메인 -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-6">
    <div class="bg-[#121722] border border-gray-800/80 rounded-3xl p-6 shadow-2xl space-y-6">
      
      <!-- 상단 헤더 정보 -->
      <div class="flex justify-between items-center border-b border-gray-800/80 pb-4">
        <div>
          <span class="text-xs font-black text-blue-400 bg-blue-950/80 border border-blue-800 px-3 py-1 rounded-full inline-flex items-center gap-1">
            <i class="fa-solid fa-scale-balanced"></i> 토론 매치
          </span>
          <h1 id="match-title" class="text-2xl md:text-3xl font-black italic mt-2 text-white">토론 주제 불러오는 중...</h1>
        </div>
        <div class="text-right">
          <span class="text-xs text-gray-400">총 투표수: <strong id="total-votes" class="text-white">0</strong>표</span>
        </div>
      </div>

      <!-- 양자대결 카운트 및 선택지 (더미 이미지 완전히 비움) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 relative">
        
        <!-- VS 배지 -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 hidden md:flex w-10 h-10 bg-amber-500 rounded-full border-4 border-[#121722] items-center justify-center shadow-lg">
          <span class="font-black italic text-black text-xs">VS</span>
        </div>

        <!-- 옵션 A 카드 -->
        <div class="bg-gray-900/90 border border-blue-900/40 rounded-2xl p-5 flex flex-col justify-between space-y-4">
          <!-- 이미지 영역: 업로드 사진 없으면 기본 UI -->
          <div id="img-container-a" class="h-56 md:h-64 rounded-xl overflow-hidden bg-gradient-to-br from-blue-950/40 to-gray-950 flex items-center justify-center relative border border-gray-800">
            <!-- JS에서 Dynamic Insert -->
          </div>

          <div class="space-y-1">
            <span id="team-a" class="text-xs font-bold text-blue-400">소속팀</span>
            <h3 id="name-a" class="text-xl font-black text-white">이름</h3>
          </div>

          <div class="flex items-center justify-between border-t border-gray-800 pt-3">
            <div>
              <span id="percent-a" class="text-2xl font-black text-blue-400">0%</span>
              <p id="votes-a" class="text-xs text-gray-400">0표</p>
            </div>
            <button onclick="vote('a')" id="btn-vote-a" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-blue-500/20">
              투표하기
            </button>
          </div>
        </div>

        <!-- 옵션 B 카드 -->
        <div class="bg-gray-900/90 border border-red-900/40 rounded-2xl p-5 flex flex-col justify-between space-y-4">
          <!-- 이미지 영역: 더미 URL 완전히 삭제 -->
          <div id="img-container-b" class="h-56 md:h-64 rounded-xl overflow-hidden bg-gradient-to-br from-red-950/40 to-gray-950 flex items-center justify-center relative border border-gray-800">
            <!-- JS에서 Dynamic Insert -->
          </div>

          <div class="space-y-1">
            <span id="team-b" class="text-xs font-bold text-red-400">소속팀</span>
            <h3 id="name-b" class="text-xl font-black text-white">이름</h3>
          </div>

          <div class="flex items-center justify-between border-t border-gray-800 pt-3">
            <div>
              <span id="percent-b" class="text-2xl font-black text-red-400">0%</span>
              <p id="votes-b" class="text-xs text-gray-400">0표</p>
            </div>
            <button onclick="vote('b')" id="btn-vote-b" class="bg-red-600 hover:bg-red-500 text-white font-black text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-red-500/20">
              투표하기
            </button>
          </div>
        </div>

      </div>

      <!-- 투표 진행바 -->
      <div class="w-full bg-gray-900 rounded-full h-3 overflow-hidden flex border border-gray-800">
        <div id="bar-a" class="bg-blue-500 h-full transition-all duration-500" style="width: 50%"></div>
        <div id="bar-b" class="bg-red-500 h-full transition-all duration-500" style="width: 50%"></div>
      </div>

    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'main';

    // 메인 기본 토론 정보 (더미 이미지 완전히 비움)
    const mainMatch = {
      id: 'main',
      title: '2020년대 최고의 프리미어리그 윙어는?',
      optionA: { name: '손흥민', team: '토트넘 홋스퍼', img: '', votes: 9 },
      optionB: { name: '모하메드 살라', team: '리버풀 FC', img: '', votes: 2 }
    };

    let currentMatch = null;

    function loadMatch() {
      if (matchId === 'main') {
        const savedMain = localStorage.getItem('main_match_data');
        currentMatch = savedMain ? JSON.parse(savedMain) : mainMatch;
      } else {
        const customMatches = JSON.parse(localStorage.getItem('custom_matches') || '[]');
        currentMatch = customMatches.find(m => m.id === matchId);
      }

      if (!currentMatch) {
        alert("존재하지 않거나 삭제된 토론 주제입니다.");
        location.href = 'index.html';
        return;
      }

      render();
    }

    function renderImg(containerId, imgUrl, defaultIconClass, colorClass) {
      const container = document.getElementById(containerId);
      if (imgUrl && imgUrl.trim() !== '') {
        container.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover">`;
      } else {
        container.innerHTML = `<i class="${defaultIconClass} text-5xl ${colorClass} opacity-60"></i>`;
      }
    }

    function render() {
      document.getElementById('match-title').innerText = currentMatch.title;
      
      // 선택지 A
      document.getElementById('name-a').innerText = currentMatch.optionA.name;
      document.getElementById('team-a').innerText = currentMatch.optionA.team || '';
      document.getElementById('votes-a').innerText = `${currentMatch.optionA.votes || 0}표`;
      renderImg('img-container-a', currentMatch.optionA.img, 'fa-solid fa-user-ninja', 'text-blue-400');

      // 선택지 B (살라 더미 이미지 완전 제거)
      document.getElementById('name-b').innerText = currentMatch.optionB.name;
      document.getElementById('team-b').innerText = currentMatch.optionB.team || '';
      document.getElementById('votes-b').innerText = `${currentMatch.optionB.votes || 0}표`;
      renderImg('img-container-b', currentMatch.optionB.img, 'fa-solid fa-user-ninja', 'text-red-400');

      // 비율 계산
      const vA = currentMatch.optionA.votes || 0;
      const vB = currentMatch.optionB.votes || 0;
      const total = vA + vB;

      document.getElementById('total-votes').innerText = total;

      let pA = 50, pB = 50;
      if (total > 0) {
        pA = Math.round((vA / total) * 100);
        pB = 100 - pA;
      }

      document.getElementById('percent-a').innerText = `${pA}%`;
      document.getElementById('percent-b').innerText = `${pB}%`;
      document.getElementById('bar-a').style.width = `${pA}%`;
      document.getElementById('bar-b').style.width = `${pB}%`;
    }

    function vote(type) {
      if (type === 'a') currentMatch.optionA.votes++;
      else currentMatch.optionB.votes++;

      if (matchId === 'main') {
        localStorage.setItem('main_match_data', JSON.stringify(currentMatch));
      } else {
        const customMatches = JSON.parse(localStorage.getItem('custom_matches') || '[]');
        const idx = customMatches.findIndex(m => m.id === matchId);
        if (idx !== -1) {
          customMatches[idx] = currentMatch;
          localStorage.setItem('custom_matches', JSON.stringify(customMatches));
        }
      }

      render();
    }

    document.addEventListener('DOMContentLoaded', loadMatch);
  </script>
</body>
</html>
