<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOMON'S - 토론 상세</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#3B82F6', accent: '#EF4444', darkbg: '#0A0D14', cardbg: '#121722' },
          fontFamily: { sports: ['Oswald', 'Noto Sans KR', 'sans-serif'], sans: ['Noto Sans KR', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .font-sports-title { font-family: 'Oswald', 'Noto Sans KR', sans-serif; }
    .vote-bar-transition { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="bg-[#0A0D14] text-gray-100 min-h-screen font-sans antialiased">

  <!-- 상단 네비게이션 -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0A0D14]/90 border-b border-gray-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='index.html'">
        <span class="font-sports-title text-3xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-red-500 uppercase">
          SOLOMON'S
        </span>
      </div>
      <a href="index.html" class="text-xs font-bold bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> 목록으로 돌아가기
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <section class="relative rounded-3xl overflow-hidden border border-gray-800/80 bg-[#121722] shadow-2xl p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <span class="text-xs font-black uppercase tracking-widest text-blue-400 bg-blue-950/80 px-3 py-1 rounded-full border border-blue-800/60 inline-flex items-center gap-1.5">
            <i class="fa-solid fa-poll"></i> 토론 매치
          </span>
          <h1 id="match-title" class="text-2xl md:text-4xl font-black mt-2 tracking-tight italic">로딩 중...</h1>
        </div>
        <div class="text-xs text-gray-400 bg-gray-900/90 px-3.5 py-2 rounded-xl border border-gray-800 w-fit">
          총 투표수: <span id="total-votes" class="font-sports-title text-lg font-bold text-white ml-1">0</span>표
        </div>
      </div>

      <!-- 양자 대결 카드 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
        <div class="hidden md:flex absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-14 h-14 rounded-full bg-[#0A0D14] border-2 border-yellow-500/80 items-center justify-center font-sports-title font-black italic text-xl text-yellow-400 shadow-2xl shadow-yellow-500/20">
          VS
        </div>

        <!-- 카드 A -->
        <div class="group relative rounded-2xl overflow-hidden border-2 border-gray-800/80 bg-gray-900 flex flex-col justify-between">
          <div class="h-80 w-full overflow-hidden relative cursor-pointer" onclick="handleVote('a')">
            <img id="img-a" src="" class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0A0D14] via-transparent to-black/30"></div>
            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
              <div>
                <span id="team-a" class="text-xs font-bold uppercase tracking-wider text-blue-400 bg-blue-950/90 px-2.5 py-0.5 rounded border border-blue-800"></span>
                <h3 id="name-a" class="text-3xl font-black text-white mt-1 italic tracking-wide"></h3>
              </div>
              <span id="pct-a" class="font-sports-title text-4xl font-black text-blue-400 tracking-wider">0%</span>
            </div>
          </div>
          <div class="p-4 bg-gray-950/90 flex items-center justify-between border-t border-gray-800">
            <span class="text-xs text-gray-400"><span id="count-a" class="font-sports-title text-base font-bold text-gray-200">0</span>표</span>
            <button id="btn-a" onclick="handleVote('a')" class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider bg-blue-600 hover:bg-blue-500 text-white transition shadow-lg shadow-blue-600/30">
              선택 및 투표
            </button>
          </div>
        </div>

        <!-- 카드 B -->
        <div class="group relative rounded-2xl overflow-hidden border-2 border-gray-800/80 bg-gray-900 flex flex-col justify-between">
          <div class="h-80 w-full overflow-hidden relative cursor-pointer" onclick="handleVote('b')">
            <img id="img-b" src="" class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0A0D14] via-transparent to-black/30"></div>
            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
              <div>
                <span id="team-b" class="text-xs font-bold uppercase tracking-wider text-red-400 bg-red-950/90 px-2.5 py-0.5 rounded border border-red-800"></span>
                <h3 id="name-b" class="text-3xl font-black text-white mt-1 italic tracking-wide"></h3>
              </div>
              <span id="pct-b" class="font-sports-title text-4xl font-black text-red-400 tracking-wider">0%</span>
            </div>
          </div>
          <div class="p-4 bg-gray-950/90 flex items-center justify-between border-t border-gray-800">
            <span class="text-xs text-gray-400"><span id="count-b" class="font-sports-title text-base font-bold text-gray-200">0</span>표</span>
            <button id="btn-b" onclick="handleVote('b')" class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider bg-red-600 hover:bg-red-500 text-white transition shadow-lg shadow-red-600/30">
              선택 및 투표
            </button>
          </div>
        </div>
      </div>

      <!-- 게이지 바 -->
      <div class="mt-6">
        <div class="w-full h-4 bg-gray-900 rounded-full overflow-hidden flex p-0.5 border border-gray-800">
          <div id="bar-a" style="width: 50%" class="h-full bg-gradient-to-r from-blue-600 to-indigo-500 vote-bar-transition rounded-l-full"></div>
          <div id="bar-b" style="width: 50%" class="h-full bg-gradient-to-r from-red-500 to-rose-600 vote-bar-transition rounded-r-full"></div>
        </div>
      </div>

      <!-- 실시간 댓글 섹션 -->
      <div class="mt-8 pt-6 border-t border-gray-800/80">
        <h3 class="text-lg font-bold mb-4 flex items-center gap-2 italic">
          <i class="fa-solid fa-comments text-blue-500"></i> 실시간 의견 (<span id="comment-count" class="text-blue-400">0</span>)
        </h3>
        
        <form onsubmit="addComment(event)" class="flex flex-col sm:flex-row gap-2 mb-6">
          <input type="text" id="comment-author" placeholder="닉네임" required class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-2.5 sm:w-28 focus:outline-none focus:border-blue-500">
          <select id="comment-side" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-500">
            <option value="A">A 지지</option>
            <option value="B">B 지지</option>
            <option value="NEUTRAL">중립/기타</option>
          </select>
          <input type="text" id="comment-input" placeholder="이 매치에 대한 의견을 솔직하게 남겨주세요!" required class="flex-1 bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 placeholder-gray-500">
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-black px-5 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 whitespace-nowrap">
            <i class="fa-solid fa-paper-plane"></i> 등록
          </button>
        </form>

        <div id="comments-list" class="space-y-2.5 max-h-80 overflow-y-auto pr-2"></div>
      </div>
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id');

    let currentMatch = null;

    function hasVoted(id) { return localStorage.getItem(`voted_${id}`) !== null; }
    function recordVote(id, opt) { localStorage.setItem(`voted_${id}`, opt); }
    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

    function loadMatchData() {
      if (!matchId) {
        alert('잘못된 접근입니다.');
        location.href = 'index.html';
        return;
      }

      if (matchId === 'main') {
        // 메인 매치는 D1 DB에서 가져오는 기본 뼈대만 지정
        currentMatch = {
          id: 'main',
          title: '2020년대 최고의 프리미어리그 윙어는?',
          optionA: { name: '손흥민', team: '토트넘 홋스퍼', img: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=900&q=80', votes: 0 },
          optionB: { name: '모하메드 살라', team: '리버풀 FC', img: 'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=900&q=80', votes: 0 }
        };
        fetchMainPoll();
      } else {
        // 사용자가 추가한 커스텀 매치 데이터 읽기
        const saved = localStorage.getItem('custom_matches');
        const list = saved ? JSON.parse(saved) : [];
        currentMatch = list.find(m => m.id === matchId);
        
        if (!currentMatch) {
          alert('존재하지 않거나 삭제된 토론입니다.');
          location.href = 'index.html';
          return;
        }
        updateUI();
      }
    }

    async function fetchMainPoll() {
      try {
        const res = await fetch(`/api/poll?id=main`);
        const poll = await res.json();
        currentMatch.optionA.votes = poll.option_a || 0;
        currentMatch.optionB.votes = poll.option_b || 0;
        updateUI();
      } catch (err) { 
        console.error('메인 투표 데이터 조회 실패:', err); 
        updateUI(); 
      }
    }

    function updateUI() {
      if (!currentMatch) return;

      document.getElementById('match-title').innerText = currentMatch.title;
      document.getElementById('name-a').innerText = currentMatch.optionA.name;
      document.getElementById('team-a').innerText = currentMatch.optionA.team;
      document.getElementById('img-a').src = currentMatch.optionA.img;
      
      document.getElementById('name-b').innerText = currentMatch.optionB.name;
      document.getElementById('team-b').innerText = currentMatch.optionB.team;
      document.getElementById('img-b').src = currentMatch.optionB.img;

      // 댓글 드롭다운 옵션 텍스트도 매치 이름으로 동적 변경
      const commentSelect = document.getElementById('comment-side');
      if (commentSelect && commentSelect.options.length >= 2) {
        commentSelect.options[0].text = `${currentMatch.optionA.name} 지지`;
        commentSelect.options[1].text = `${currentMatch.optionB.name} 지지`;
      }

      const votesA = currentMatch.optionA.votes || 0;
      const votesB = currentMatch.optionB.votes || 0;
      const total = votesA + votesB;
      const pctA = total === 0 ? 50 : Math.round((votesA / total) * 100);
      const pctB = total === 0 ? 50 : 100 - pctA;

      document.getElementById('total-votes').innerText = total.toLocaleString();
      document.getElementById('count-a').innerText = votesA.toLocaleString();
      document.getElementById('count-b').innerText = votesB.toLocaleString();
      document.getElementById('pct-a').innerText = `${total === 0 ? 0 : pctA}%`;
      document.getElementById('pct-b').innerText = `${total === 0 ? 0 : pctB}%`;

      document.getElementById('bar-a').style.width = `${pctA}%`;
      document.getElementById('bar-b').style.width = `${pctB}%`;

      if (hasVoted(matchId)) {
        const choice = localStorage.getItem(`voted_${matchId}`);
        const btnA = document.getElementById('btn-a');
        const btnB = document.getElementById('btn-b');
        btnA.innerText = choice === 'a' ? '✓ 투표 완료' : '투표 완료';
        btnB.innerText = choice === 'b' ? '✓ 투표 완료' : '투표 완료';
        btnA.className = 'px-5 py-2 rounded-xl text-xs font-black bg-gray-700 text-gray-400 cursor-not-allowed';
        btnB.className = 'px-5 py-2 rounded-xl text-xs font-black bg-gray-700 text-gray-400 cursor-not-allowed';
      }
    }

    async function handleVote(opt) {
      if (hasVoted(matchId)) return alert('이미 이 토론에 투표하셨습니다!');

      if (matchId === 'main') {
        await fetch('/api/poll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: 'main', option: opt })
        });
        recordVote('main', opt);
        fetchMainPoll();
      } else {
        const saved = localStorage.getItem('custom_matches');
        const list = saved ? JSON.parse(saved) : [];
        const m = list.find(item => item.id === matchId);
        if (m) {
          if (opt === 'a') m.optionA.votes += 1;
          else m.optionB.votes += 1;
          localStorage.setItem('custom_matches', JSON.stringify(list));
          currentMatch = m;
          recordVote(matchId, opt);
          updateUI();
        }
      }
    }

    // 댓글 관리
    async function loadComments() {
      if (!matchId) return;
      try {
        const res = await fetch(`/api/comments?page_id=${matchId}`);
        const comments = await res.json();
        renderComments(comments);
      } catch (err) { 
        console.error('댓글 불러오기 실패:', err); 
      }
    }

    async function addComment(e) {
      e.preventDefault();
      const author = document.getElementById('comment-author').value.trim();
      const side = document.getElementById('comment-side').value;
      const text = document.getElementById('comment-input').value.trim();

      if (!author || !text) return alert('닉네임과 내용을 입력해주세요.');

      const contentPayload = `[${side}] ${text}`;
      await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_id: matchId, author, content: contentPayload })
      });

      document.getElementById('comment-input').value = '';
      loadComments();
    }

    function renderComments(comments) {
      const container = document.getElementById('comments-list');
      document.getElementById('comment-count').innerText = comments ? comments.length : 0;
      
      if (!comments || comments.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 italic py-2">아직 댓글이 없습니다. 첫 의견을 작성해보세요!</p>`;
        return;
      }
      
      container.innerHTML = comments.map(c => `
        <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-3 flex justify-between items-start">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-blue-400">${escapeHtml(c.author)}</span>
              <span class="text-[11px] text-gray-500">${c.created_at || ''}</span>
            </div>
            <p class="text-xs text-gray-200">${escapeHtml(c.content)}</p>
          </div>
        </div>
      `).join('');
    }

    // 초기 실행
    loadMatchData();
    loadComments();
  </script>
</body>
</html>
