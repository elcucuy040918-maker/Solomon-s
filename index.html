<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOMON'S - 스포츠 토론 & 실시간 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#3B82F6', accent: '#EF4444', darkbg: '#0A0D14', cardbg: '#121722' },
          fontFamily: { sports: ['Oswald', 'Noto Sans KR', 'sans-serif'], sans: ['Noto Sans KR', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0A0D14] text-gray-100 min-h-screen font-sans antialiased flex flex-col justify-between">

  <!-- 상단 네비게이션 -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0A0D14]/90 border-b border-gray-800/80">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='index.html'">
        <span class="font-sports-title text-3xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-red-500 uppercase">
          SOLOMON'S
        </span>
        <span class="bg-red-500/20 text-red-400 text-xs font-black px-2.5 py-0.5 rounded-full border border-red-500/40 animate-pulse tracking-wider hidden sm:inline-block">
          TOP 3
        </span>
      </div>
      
      <!-- 전체 토론 보기 버튼 -> list.html 이동 -->
      <div>
        <button onclick="location.href='list.html'" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-black px-4 py-2.5 rounded-xl border border-blue-400/30 transition flex items-center gap-2 shadow-lg shadow-blue-500/20">
          <i class="fa-solid fa-list-ul"></i> 전체 토론 보기
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 TOP 3 토론 영역 -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full space-y-8">
    <div class="flex items-center justify-between mb-4">
      <div>
        <span class="text-xs font-black uppercase tracking-widest text-red-400 bg-red-950/80 px-3 py-1 rounded-full border border-red-800/60 inline-flex items-center gap-1.5">
          <i class="fa-solid fa-fire"></i> REALTIME HOT TOP 3
        </span>
        <h1 class="text-2xl md:text-3xl font-black mt-2 tracking-tight italic">인기 토론 TOP 3</h1>
      </div>
    </div>

    <!-- TOP 3 카드가 들어갈 컨테이너 -->
    <div id="top3-container" class="space-y-6"></div>
  </main>

  <footer class="border-t border-gray-800/60 py-8 text-center text-xs text-gray-500">
    © SOLOMON'S. All rights reserved.
  </footer>

  <script>
    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

    const defaultMainMatch = {
      id: 'main',
      title: '2020년대 최고의 프리미어리그 윙어는?',
      optionA: { name: '손흥민', team: '토트넘 홋스퍼', img: '', votes: 9 },
      optionB: { name: '모하메드 살라', team: '리버풀 FC', img: '', votes: 2 }
    };

    function getTop3Matches() {
      const savedMain = localStorage.getItem('main_match_data');
      const mainData = savedMain ? JSON.parse(savedMain) : defaultMainMatch;
      const customMatches = JSON.parse(localStorage.getItem('custom_matches') || '[]');

      const allMatches = [mainData, ...customMatches];

      // 총 투표수 기준 내림차순 정렬 후 상위 3개 슬라이스
      allMatches.sort((a, b) => {
        const totalA = (a.optionA.votes || 0) + (a.optionB.votes || 0);
        const totalB = (b.optionA.votes || 0) + (b.optionB.votes || 0);
        return totalB - totalA;
      });

      return allMatches.slice(0, 3);
    }

    function renderTop3() {
      const top3 = getTop3Matches();

      const html = top3.map((m, idx) => {
        const rankBadges = [
          '<span class="text-xs font-black text-amber-400 bg-amber-950/90 border border-amber-600 px-3 py-1 rounded-full">🥇 1위</span>',
          '<span class="text-xs font-black text-gray-300 bg-gray-900/90 border border-gray-600 px-3 py-1 rounded-full">🥈 2위</span>',
          '<span class="text-xs font-black text-amber-600 bg-amber-950/90 border border-amber-800 px-3 py-1 rounded-full">🥉 3위</span>'
        ];

        const imgA = m.optionA.img 
          ? `<img src="${m.optionA.img}" class="w-full h-full object-cover">` 
          : `<i class="fa-solid fa-user-ninja text-4xl text-blue-400/60 mb-2"></i>`;

        const imgB = m.optionB.img 
          ? `<img src="${m.optionB.img}" class="w-full h-full object-cover">` 
          : `<i class="fa-solid fa-user-ninja text-4xl text-red-400/60 mb-2"></i>`;

        const totalVotes = (m.optionA.votes || 0) + (m.optionB.votes || 0);

        return `
          <div onclick="location.href='detail.html?id=${m.id}'" class="group relative rounded-3xl overflow-hidden border border-gray-800 hover:border-blue-500/80 bg-[#121722] transition duration-300 cursor-pointer shadow-2xl flex flex-col justify-between">
            <div class="p-6">
              <div class="flex justify-between items-center mb-3">
                ${rankBadges[idx]}
                <span class="text-xs text-gray-400"><i class="fa-solid fa-fire text-red-500"></i> 총 ${totalVotes}표 참여</span>
              </div>
              <h2 class="text-xl md:text-2xl font-black italic tracking-wide group-hover:text-blue-400 transition">${escapeHtml(m.title)}</h2>
            </div>

            <div class="grid grid-cols-2 gap-3 p-4 bg-gray-950/50">
              <div class="h-40 md:h-48 rounded-2xl border border-blue-900/40 bg-gradient-to-br from-blue-950/40 to-gray-900/80 flex flex-col items-center justify-center p-4 text-center overflow-hidden">
                ${imgA}
                <p class="text-base md:text-lg font-black text-white mt-1">${escapeHtml(m.optionA.name)}</p>
                <span class="text-xs text-blue-400/80">${escapeHtml(m.optionA.team || '')}</span>
              </div>
              <div class="h-40 md:h-48 rounded-2xl border border-red-900/40 bg-gradient-to-br from-red-950/40 to-gray-900/80 flex flex-col items-center justify-center p-4 text-center overflow-hidden">
                ${imgB}
                <p class="text-base md:text-lg font-black text-white mt-1">${escapeHtml(m.optionB.name)}</p>
                <span class="text-xs text-red-400/80">${escapeHtml(m.optionB.team || '')}</span>
              </div>
            </div>

            <div class="p-5 border-t border-gray-800/80 flex justify-between items-center text-xs md:text-sm text-gray-400 bg-gray-900/60">
              <span class="font-bold">${escapeHtml(m.optionA.name)} VS ${escapeHtml(m.optionB.name)}</span>
              <span class="text-blue-400 font-black group-hover:translate-x-1.5 transition">투표 참여하기 →</span>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('top3-container').innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', renderTop3);
  </script>
</body>
</html>
