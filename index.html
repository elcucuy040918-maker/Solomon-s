<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOMON'S - 스포츠 토론 & 실시간 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0A0D14] text-gray-100 min-h-screen font-sans antialiased flex flex-col justify-between">

  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0A0D14]/90 border-b border-gray-800/80">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='index.html'">
        <span class="font-black italic tracking-widest text-3xl text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-red-500 uppercase">
          SOLOMON'S
        </span>
      </div>
      <button onclick="location.href='list.html'" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-black px-4 py-2.5 rounded-xl border border-blue-400/30 transition flex items-center gap-2 shadow-lg shadow-blue-500/20">
        <i class="fa-solid fa-list-ul"></i> 전체 토론 보기
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10 w-full space-y-8">
    <div class="flex items-center justify-between mb-4">
      <div>
        <span class="text-xs font-black uppercase tracking-widest text-red-400 bg-red-950/80 px-3 py-1 rounded-full border border-red-800/60 inline-flex items-center gap-1.5">
          <i class="fa-solid fa-fire"></i> REALTIME HOT TOP 3
        </span>
        <h1 class="text-2xl md:text-3xl font-black mt-2 tracking-tight italic">인기 토론 TOP 3</h1>
      </div>
    </div>

    <div id="top3-container" class="space-y-6">
      <div class="text-center py-10 text-gray-400">데이터를 불러오는 중입니다...</div>
    </div>
  </main>

  <footer class="border-t border-gray-800/60 py-8 text-center text-xs text-gray-500">
    © SOLOMON'S. All rights reserved.
  </footer>

  <script>
    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

    async function renderTop3() {
      try {
        const res = await fetch('/api/poll');
        const matches = await res.json();

        if (!matches || matches.length === 0) {
          document.getElementById('top3-container').innerHTML = '<div class="text-center py-10 text-gray-400">진행 중인 토론이 없습니다.</div>';
          return;
        }

        matches.sort((a, b) => ((b.option_a_votes || 0) + (b.option_b_votes || 0)) - ((a.option_a_votes || 0) + (a.option_b_votes || 0)));
        const top3 = matches.slice(0, 3);

        const html = top3.map((m, idx) => {
          const rankBadges = [
            '<span class="text-xs font-black text-amber-400 bg-amber-950/90 border border-amber-600 px-3 py-1 rounded-full">🥇 1위</span>',
            '<span class="text-xs font-black text-gray-300 bg-gray-900/90 border border-gray-600 px-3 py-1 rounded-full">🥈 2위</span>',
            '<span class="text-xs font-black text-amber-600 bg-amber-950/90 border border-amber-800 px-3 py-1 rounded-full">🥉 3위</span>'
          ];

          const colorA = m.option_a_color || '#3B82F6';
          const colorB = m.option_b_color || '#EF4444';

          // 사진 짤림 방지 (object-contain 적용)
          const imgA = m.option_a_img 
            ? `<img src="${m.option_a_img}" class="w-full h-full object-contain p-2">` 
            : `<i class="fa-solid fa-user-ninja text-4xl opacity-60 mb-2"></i>`;

          const imgB = m.option_b_img 
            ? `<img src="${m.option_b_img}" class="w-full h-full object-contain p-2">` 
            : `<i class="fa-solid fa-user-ninja text-4xl opacity-60 mb-2"></i>`;

          const vA = m.option_a_votes || 0;
          const vB = m.option_b_votes || 0;
          const totalVotes = vA + vB;
          let pA = 50, pB = 50;
          if (totalVotes > 0) {
            pA = Math.round((vA / totalVotes) * 100);
            pB = 100 - pA;
          }

          return `
            <div onclick="location.href='detail.html?id=${m.id}'" class="group relative rounded-3xl overflow-hidden border border-gray-800 hover:border-blue-500/80 bg-[#121722] transition duration-300 cursor-pointer shadow-2xl flex flex-col justify-between">
              <div class="p-6 pb-2">
                <div class="flex justify-between items-center mb-3">
                  ${rankBadges[idx]}
                  <span class="text-xs text-gray-400 font-bold"><i class="fa-solid fa-users text-blue-400"></i> ${totalVotes}명 참여</span>
                </div>
                <h2 class="text-xl md:text-2xl font-black italic group-hover:text-blue-400 transition">${escapeHtml(m.title)}</h2>
                ${m.description ? `<p class="text-xs text-amber-400/90 bg-amber-950/40 border border-amber-800/40 p-2 rounded-xl mt-2"><i class="fa-solid fa-circle-info mr-1"></i> ${escapeHtml(m.description)}</p>` : ''}
              </div>

              <!-- 이미지 박스 (짤림 방지) -->
              <div class="grid grid-cols-2 gap-3 p-4 bg-gray-950/50">
                <div class="h-40 md:h-48 rounded-2xl border border-gray-800 bg-gray-900/80 flex flex-col items-center justify-center overflow-hidden">
                  ${imgA}
                  <p class="text-sm font-black text-white mt-1">${escapeHtml(m.option_a_name)}</p>
                  <span class="text-[11px] text-gray-400">${escapeHtml(m.option_a_team || '')}</span>
                </div>
                <div class="h-40 md:h-48 rounded-2xl border border-gray-800 bg-gray-900/80 flex flex-col items-center justify-center overflow-hidden">
                  ${imgB}
                  <p class="text-sm font-black text-white mt-1">${escapeHtml(m.option_b_name)}</p>
                  <span class="text-[11px] text-gray-400">${escapeHtml(m.option_b_team || '')}</span>
                </div>
              </div>

              <!-- 게이지 바 & 퍼센트 -->
              <div class="px-6 py-3 bg-gray-900/90 border-t border-gray-800/80 space-y-2">
                <div class="flex justify-between text-xs font-black">
                  <span style="color: ${colorA}">${escapeHtml(m.option_a_name)} ${pA}% (${vA}표)</span>
                  <span style="color: ${colorB}">${escapeHtml(m.option_b_name)} ${pB}% (${vB}표)</span>
                </div>
                <div class="w-full bg-gray-800 h-3 rounded-full overflow-hidden flex">
                  <div style="width: ${pA}%; background-color: ${colorA};" class="h-full transition-all duration-500"></div>
                  <div style="width: ${pB}%; background-color: ${colorB};" class="h-full transition-all duration-500"></div>
                </div>
              </div>

              <div class="p-4 border-t border-gray-800/80 flex justify-between items-center text-xs text-gray-400 bg-gray-950">
                <span class="font-bold">실시간 토론 참여하기</span>
                <span class="text-blue-400 font-black group-hover:translate-x-1.5 transition">입장하기 →</span>
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('top3-container').innerHTML = html;
      } catch (e) {
        document.getElementById('top3-container').innerHTML = '<div class="text-center py-10 text-red-400">데이터를 불러오지 못했습니다.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', renderTop3);
  </script>
</body>
</html>
