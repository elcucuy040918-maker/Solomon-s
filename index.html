<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOMON'S - 스포츠 토론 & 실시간 투표</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#3B82F6',
            accent: '#EF4444',
            darkbg: '#0A0D14',
            cardbg: '#121722',
          },
          fontFamily: {
            sports: ['Oswald', 'Noto Sans KR', 'sans-serif'],
            sans: ['Noto Sans KR', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .font-sports-title { font-family: 'Oswald', 'Noto Sans KR', sans-serif; }
    .vote-bar-transition { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="bg-[#0A0D14] text-gray-100 min-h-screen font-sans antialiased">

  <!-- 상단 네비게이션 -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0A0D14]/90 border-b border-gray-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="font-sports-title text-3xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-red-500 uppercase">
          SOLOMON'S
        </span>
        <span class="bg-red-500/20 text-red-400 text-xs font-black px-2.5 py-0.5 rounded-full border border-red-500/40 animate-pulse tracking-wider">
          LIVE VOTE
        </span>
      </div>
      <nav class="flex items-center space-x-4 text-sm font-bold uppercase tracking-wider">
        <a href="#hero-debate" class="text-blue-400 border-b-2 border-blue-500 pb-1">핫 토론 매치</a>
        <a href="#all-matches" class="text-gray-400 hover:text-white transition">전체 투표</a>
        <!-- 1. 주제 추가 + 버튼 -->
        <button onclick="openModal()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-black px-3.5 py-2 rounded-xl border border-blue-400/30 transition flex items-center gap-1.5 shadow-lg shadow-blue-500/20">
          <i class="fa-solid fa-plus"></i> 토론 주제 추가
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">

    <!-- 1. 메인 히어로 매치 -->
    <section id="hero-debate" class="relative rounded-3xl overflow-hidden border border-gray-800/80 bg-[#121722] shadow-2xl p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <span class="text-xs font-black uppercase tracking-widest text-red-400 bg-red-950/80 px-3 py-1 rounded-full border border-red-800/60 inline-flex items-center gap-1.5">
            <i class="fa-solid fa-fire"></i> 오늘 가장 뜨거운 매치
          </span>
          <h1 class="text-2xl md:text-4xl font-black mt-2 tracking-tight italic">2020년대 최고의 프리미어리그 윙어는?</h1>
        </div>
        <div id="hero-total-badge" class="text-xs text-gray-400 bg-gray-900/90 px-3.5 py-2 rounded-xl border border-gray-800 w-fit">
          총 투표수: <span id="hero-total-votes" class="font-sports-title text-lg font-bold text-white ml-1">0</span>표
        </div>
      </div>

      <!-- 양자 대결 카드 그리드 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
        <div class="hidden md:flex absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-14 h-14 rounded-full bg-[#0A0D14] border-2 border-yellow-500/80 items-center justify-center font-sports-title font-black italic text-xl text-yellow-400 shadow-2xl shadow-yellow-500/20">
          VS
        </div>

        <!-- 옵션 A: 손흥민 -->
        <div id="hero-card-a" class="group relative rounded-2xl overflow-hidden border-2 border-gray-800/80 hover:border-blue-500/80 transition-all duration-300 bg-gray-900 flex flex-col justify-between">
          <div class="h-80 w-full overflow-hidden relative cursor-pointer" onclick="handleHeroVote('a')">
            <img id="hero-img-a" src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=900&q=80" alt="손흥민" class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0A0D14] via-transparent to-black/30"></div>
            
            <label onclick="event.stopPropagation();" class="absolute top-3 right-3 bg-black/60 hover:bg-black/90 text-gray-300 text-xs px-2.5 py-1 rounded-lg border border-gray-700 transition flex items-center gap-1.5 backdrop-blur-sm z-10 cursor-pointer">
              <i class="fa-solid fa-camera"></i> 이미지 수정
              <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'hero-img-a')">
            </label>

            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-blue-400 bg-blue-950/90 px-2.5 py-0.5 rounded border border-blue-800">토트넘 홋스퍼</span>
                <h3 class="text-3xl font-black text-white mt-1 italic tracking-wide">손흥민</h3>
              </div>
              <span id="hero-pct-a" class="font-sports-title text-4xl font-black text-blue-400 tracking-wider">0%</span>
            </div>
          </div>
          <div class="p-4 bg-gray-950/90 flex items-center justify-between border-t border-gray-800">
            <span class="text-xs text-gray-400"><span id="hero-count-a" class="font-sports-title text-base font-bold text-gray-200">0</span>표</span>
            <button id="hero-btn-a" onclick="handleHeroVote('a')" class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider bg-blue-600 hover:bg-blue-500 text-white transition shadow-lg shadow-blue-600/30">
              선택 및 투표
            </button>
          </div>
        </div>

        <!-- 옵션 B: 모하메드 살라 -->
        <div id="hero-card-b" class="group relative rounded-2xl overflow-hidden border-2 border-gray-800/80 hover:border-red-500/80 transition-all duration-300 bg-gray-900 flex flex-col justify-between">
          <div class="h-80 w-full overflow-hidden relative cursor-pointer" onclick="handleHeroVote('b')">
            <img id="hero-img-b" src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=900&q=80" alt="모하메드 살라" class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0A0D14] via-transparent to-black/30"></div>
            
            <label onclick="event.stopPropagation();" class="absolute top-3 right-3 bg-black/60 hover:bg-black/90 text-gray-300 text-xs px-2.5 py-1 rounded-lg border border-gray-700 transition flex items-center gap-1.5 backdrop-blur-sm z-10 cursor-pointer">
              <i class="fa-solid fa-camera"></i> 이미지 수정
              <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'hero-img-b')">
            </label>

            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-red-400 bg-red-950/90 px-2.5 py-0.5 rounded border border-red-800">리버풀 FC</span>
                <h3 class="text-3xl font-black text-white mt-1 italic tracking-wide">모하메드 살라</h3>
              </div>
              <span id="hero-pct-b" class="font-sports-title text-4xl font-black text-red-400 tracking-wider">0%</span>
            </div>
          </div>
          <div class="p-4 bg-gray-950/90 flex items-center justify-between border-t border-gray-800">
            <span class="text-xs text-gray-400"><span id="hero-count-b" class="font-sports-title text-base font-bold text-gray-200">0</span>표</span>
            <button id="hero-btn-b" onclick="handleHeroVote('b')" class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider bg-red-600 hover:bg-red-500 text-white transition shadow-lg shadow-red-600/30">
              선택 및 투표
            </button>
          </div>
        </div>
      </div>

      <!-- 프로그레스 게이지 -->
      <div class="mt-6">
        <div class="flex justify-between text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">
          <span class="text-blue-400">손흥민 지지율</span>
          <span class="text-red-400">모하메드 살라 지지율</span>
        </div>
        <div class="w-full h-4 bg-gray-900 rounded-full overflow-hidden flex p-0.5 border border-gray-800">
          <div id="hero-bar-a" style="width: 50%" class="h-full bg-gradient-to-r from-blue-600 to-indigo-500 vote-bar-transition rounded-l-full"></div>
          <div id="hero-bar-b" style="width: 50%" class="h-full bg-gradient-to-r from-red-500 to-rose-600 vote-bar-transition rounded-r-full"></div>
        </div>
      </div>

      <!-- 메인 매치 댓글 섹션 -->
      <div class="mt-8 pt-6 border-t border-gray-800/80">
        <h3 class="text-lg font-bold mb-4 flex items-center gap-2 italic">
          <i class="fa-solid fa-comments text-blue-500"></i> 메인 토론 실시간 의견 (<span id="hero-comment-count" class="text-blue-400">0</span>)
        </h3>
        
        <form onsubmit="addHeroComment(event)" class="flex flex-col sm:flex-row gap-2 mb-6">
          <input type="text" id="hero-comment-author" placeholder="닉네임" required class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-2.5 sm:w-28 focus:outline-none focus:border-blue-500">
          <select id="hero-comment-side" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-500">
            <option value="SON">손흥민 지지</option>
            <option value="SALAH">살라 지지</option>
            <option value="NEUTRAL">중립/기타</option>
          </select>
          <input type="text" id="hero-comment-input" placeholder="이 매치에 대한 의견을 솔직하게 남겨주세요!" required class="flex-1 bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 placeholder-gray-500">
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-black px-5 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 whitespace-nowrap">
            <i class="fa-solid fa-paper-plane"></i> 등록
          </button>
        </form>

        <div id="hero-comments-list" class="space-y-2.5 max-h-60 overflow-y-auto pr-2"></div>
      </div>
    </section>

    <!-- 2. 서브 핫 토론 카드 리스트 -->
    <section id="all-matches">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-black italic tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-bolt text-yellow-500"></i> 진행 중인 매치 토론 & 투표
        </h2>
        <span class="text-xs text-gray-400">카드를 클릭해 투표 및 댓글을 남겨보세요</span>
      </div>

      <div id="match-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>
  </main>

  <!-- 3. 토론 주제 추가 모달 (팝업) -->
  <div id="create-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#121722] border border-gray-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 class="text-xl font-black italic text-white flex items-center gap-2">
          <i class="fa-solid fa-square-plus text-blue-500"></i> 새 토론 주제 추가
        </h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
      </div>

      <form onsubmit="handleCreateMatch(event)" class="space-y-4 text-xs">
        <div>
          <label class="block text-gray-400 font-bold mb-1">토론 제목</label>
          <input type="text" id="modal-title" placeholder="예: GOAT 논쟁 - 메시 vs 호날두" required class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
        </div>

        <!-- 옵션 A 설정 -->
        <div class="p-3 bg-blue-950/30 border border-blue-900/50 rounded-xl space-y-2">
          <span class="font-bold text-blue-400 uppercase tracking-wider block">선택지 A</span>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="modal-a-name" placeholder="선수/팀/주제 이름 (예: 메시)" required class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
            <input type="text" id="modal-a-team" placeholder="소속 팀 (예: 인터 마이애미)" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
          </div>
          <input type="url" id="modal-a-img" placeholder="이미지 URL (선택사항)" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
        </div>

        <!-- 옵션 B 설정 -->
        <div class="p-3 bg-red-950/30 border border-red-900/50 rounded-xl space-y-2">
          <span class="font-bold text-red-400 uppercase tracking-wider block">선택지 B</span>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="modal-b-name" placeholder="선수/팀/주제 이름 (예: 호날두)" required class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
            <input type="text" id="modal-b-team" placeholder="소속 팀 (예: 알 나스르)" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
          </div>
          <input type="url" id="modal-b-img" placeholder="이미지 URL (선택사항)" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold">취소</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const PAGE_ID = 'main';

    // 로컬 스토리지 기반 투표 완료 여부 체크 함수
    function hasVoted(pollId) {
      return localStorage.getItem(`voted_${pollId}`) !== null;
    }

    function recordVote(pollId, option) {
      localStorage.setItem(`voted_${pollId}`, option);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // 1. D1 데이터베이스 연동: 메인 투표 로딩
    async function loadPoll() {
      try {
        const res = await fetch(`/api/poll?id=${PAGE_ID}`);
        const poll = await res.json();
        updateHeroUI(poll.option_a || 0, poll.option_b || 0);
      } catch (err) {
        console.error('투표 데이터 로드 실패:', err);
      }
    }

    // 메인 투표 실행
    async function handleHeroVote(option) {
      // 1인 1회 투표 제한 체크
      if (hasVoted(PAGE_ID)) {
        alert('이미 이 토론에 투표하셨습니다!');
        return;
      }

      try {
        await fetch('/api/poll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: PAGE_ID, option })
        });
        
        recordVote(PAGE_ID, option);
        loadPoll();
      } catch (err) {
        alert('투표 등록 실패');
      }
    }

    function updateHeroUI(votesA, votesB) {
      const total = votesA + votesB;
      const pctA = total === 0 ? 0 : Math.round((votesA / total) * 100);
      const pctB = total === 0 ? 0 : 100 - pctA;

      document.getElementById('hero-total-votes').innerText = total.toLocaleString();
      document.getElementById('hero-count-a').innerText = votesA.toLocaleString();
      document.getElementById('hero-count-b').innerText = votesB.toLocaleString();
      document.getElementById('hero-pct-a').innerText = `${pctA}%`;
      document.getElementById('hero-pct-b').innerText = `${pctB}%`;

      document.getElementById('hero-bar-a').style.width = `${total === 0 ? 50 : pctA}%`;
      document.getElementById('hero-bar-b').style.width = `${total === 0 ? 50 : pctB}%`;

      // 이미 투표한 경우 버튼 상태 변경
      if (hasVoted(PAGE_ID)) {
        const votedOption = localStorage.getItem(`voted_${PAGE_ID}`);
        const btnA = document.getElementById('hero-btn-a');
        const btnB = document.getElementById('hero-btn-b');

        btnA.innerText = votedOption === 'a' ? '✓ 투표 완료 (A선택)' : '투표 완료';
        btnB.innerText = votedOption === 'b' ? '✓ 투표 완료 (B선택)' : '투표 완료';

        btnA.classList.replace('bg-blue-600', 'bg-gray-700');
        btnB.classList.replace('bg-red-600', 'bg-gray-700');
      }
    }

    // 댓글 로딩 및 등록
    async function loadHeroComments() {
      try {
        const res = await fetch(`/api/comments?page_id=${PAGE_ID}`);
        const comments = await res.json();
        renderHeroComments(comments);
      } catch (err) {
        console.error('댓글 로드 실패:', err);
      }
    }

    async function addHeroComment(e) {
      e.preventDefault();
      const author = document.getElementById('hero-comment-author').value.trim();
      const side = document.getElementById('hero-comment-side').value;
      const text = document.getElementById('hero-comment-input').value.trim();

      if (!author || !text) return alert('닉네임과 의견을 입력해주세요.');

      const contentPayload = `[${side}] ${text}`;

      await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_id: PAGE_ID, author: author, content: contentPayload })
      });

      document.getElementById('hero-comment-input').value = '';
      loadHeroComments();
    }

    function renderHeroComments(comments) {
      const container = document.getElementById('hero-comments-list');
      document.getElementById('hero-comment-count').innerText = comments ? comments.length : 0;

      if (!comments || comments.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 italic py-2">아직 댓글이 없습니다. 첫 의견을 작성해보세요!</p>`;
        return;
      }

      container.innerHTML = comments.map(c => {
        let sideText = '중립';
        let badgeClass = 'bg-gray-800 text-gray-300 border-gray-700';
        let displayContent = c.content;

        if (c.content.startsWith('[SON]')) {
          sideText = '손흥민 지지';
          badgeClass = 'bg-blue-950/80 text-blue-400 border-blue-800';
          displayContent = c.content.replace('[SON] ', '');
        } else if (c.content.startsWith('[SALAH]')) {
          sideText = '살라 지지';
          badgeClass = 'bg-red-950/80 text-red-400 border-red-800';
          displayContent = c.content.replace('[SALAH] ', '');
        } else if (c.content.startsWith('[NEUTRAL]')) {
          displayContent = c.content.replace('[NEUTRAL] ', '');
        }

        return `
          <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-3 flex justify-between items-start gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-blue-400">${escapeHtml(c.author)}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${badgeClass}">${sideText}</span>
                <span class="text-[11px] text-gray-500">${c.created_at || ''}</span>
              </div>
              <p class="text-xs text-gray-200">${escapeHtml(displayContent)}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    // 이미지 파일 업로드
    async function uploadImage(event, targetImgId) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('이미지 파일만 업로드 가능합니다.');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/upload', { 
          method: 'POST', 
          body: formData 
        });
        
        const data = await res.json();
        
        if (res.ok && data.url) {
          document.getElementById(targetImgId).src = `${data.url}?t=${Date.now()}`;
          alert('이미지가 성공적으로 업로드되었습니다!');
        } else {
          alert(`업로드 실패: ${data.error || '오류가 발생했습니다.'}`);
        }
      } catch (err) {
        console.error('업로드 에러:', err);
        alert('이미지 업로드 중 네트워크 오류가 발생했습니다.');
      } finally {
        event.target.value = '';
      }
    }

    // === 2. 사용자 생성 매치 목록 관리 (로컬스토리지 저장) ===
    function getCustomMatches() {
      const saved = localStorage.getItem('custom_matches');
      return saved ? JSON.parse(saved) : [];
    }

    function openModal() {
      document.getElementById('create-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('create-modal').classList.add('hidden');
    }

    function handleCreateMatch(e) {
      e.preventDefault();
      const title = document.getElementById('modal-title').value.trim();
      const aName = document.getElementById('modal-a-name').value.trim();
      const aTeam = document.getElementById('modal-a-team').value.trim() || '소속/구분 A';
      const aImg = document.getElementById('modal-a-img').value.trim() || 'https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=600&q=80';
      
      const bName = document.getElementById('modal-b-name').value.trim();
      const bTeam = document.getElementById('modal-b-team').value.trim() || '소속/구분 B';
      const bImg = document.getElementById('modal-b-img').value.trim() || 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=600&q=80';

      const newMatch = {
        id: `match_${Date.now()}`,
        title,
        optionA: { name: aName, team: aTeam, img: aImg, votes: 0 },
        optionB: { name: bName, team: bTeam, img: bImg, votes: 0 }
      };

      const list = getCustomMatches();
      list.unshift(newMatch);
      localStorage.setItem('custom_matches', JSON.stringify(list));

      closeModal();
      e.target.reset();
      renderCustomMatches();
    }

    // 커스텀 매치 서브 카드 투표 처리
    function voteCustomMatch(matchId, option) {
      if (hasVoted(matchId)) {
        alert('이미 이 토론에 투표하셨습니다!');
        return;
      }

      const list = getCustomMatches();
      const match = list.find(m => m.id === matchId);
      if (!match) return;

      if (option === 'a') match.optionA.votes += 1;
      else match.optionB.votes += 1;

      localStorage.setItem('custom_matches', JSON.stringify(list));
      recordVote(matchId, option);
      renderCustomMatches();
    }

    function renderCustomMatches() {
      const container = document.getElementById('match-cards-container');
      const list = getCustomMatches();

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full border border-dashed border-gray-800 rounded-2xl p-8 text-center text-gray-500">
            <p class="text-sm font-bold mb-2">아직 추가된 토론 매치가 없습니다.</p>
            <p class="text-xs">상단의 <strong>+ 토론 주제 추가</strong> 버튼을 눌러 첫 매치를 만들어보세요!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(m => {
        const total = m.optionA.votes + m.optionB.votes;
        const pctA = total === 0 ? 50 : Math.round((m.optionA.votes / total) * 100);
        const pctB = total === 0 ? 50 : 100 - pctA;
        const voted = hasVoted(m.id);
        const userChoice = localStorage.getItem(`voted_${m.id}`);

        return `
          <div class="bg-[#121722] border border-gray-800/80 rounded-2xl p-5 shadow-lg flex flex-col justify-between space-y-4">
            <h3 class="text-lg font-black italic text-white tracking-wide">${escapeHtml(m.title)}</h3>
            
            <div class="grid grid-cols-2 gap-3 relative">
              <!-- A 선택지 -->
              <div onclick="voteCustomMatch('${m.id}', 'a')" class="group relative rounded-xl overflow-hidden border border-gray-800 hover:border-blue-500 transition cursor-pointer bg-gray-900 flex flex-col justify-between">
                <div class="h-36 w-full relative overflow-hidden">
                  <img src="${escapeHtml(m.optionA.img)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                  <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                  <div class="absolute bottom-2 left-2">
                    <span class="text-[10px] text-blue-400 bg-blue-950/80 px-1.5 py-0.5 rounded border border-blue-900">${escapeHtml(m.optionA.team)}</span>
                    <p class="text-sm font-black text-white mt-0.5">${escapeHtml(m.optionA.name)}</p>
                  </div>
                </div>
                <div class="p-2 text-xs flex justify-between items-center bg-gray-950">
                  <span class="text-gray-400 font-bold">${m.optionA.votes}표</span>
                  <span class="font-sports-title text-blue-400 font-black">${total === 0 ? 0 : pctA}%</span>
                </div>
              </div>

              <!-- B 선택지 -->
              <div onclick="voteCustomMatch('${m.id}', 'b')" class="group relative rounded-xl overflow-hidden border border-gray-800 hover:border-red-500 transition cursor-pointer bg-gray-900 flex flex-col justify-between">
                <div class="h-36 w-full relative overflow-hidden">
                  <img src="${escapeHtml(m.optionB.img)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                  <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                  <div class="absolute bottom-2 left-2">
                    <span class="text-[10px] text-red-400 bg-red-950/80 px-1.5 py-0.5 rounded border border-red-900">${escapeHtml(m.optionB.team)}</span>
                    <p class="text-sm font-black text-white mt-0.5">${escapeHtml(m.optionB.name)}</p>
                  </div>
                </div>
                <div class="p-2 text-xs flex justify-between items-center bg-gray-950">
                  <span class="text-gray-400 font-bold">${m.optionB.votes}표</span>
                  <span class="font-sports-title text-red-400 font-black">${total === 0 ? 0 : pctB}%</span>
                </div>
              </div>
            </div>

            <!-- 프로그레스 바 -->
            <div class="w-full h-2 bg-gray-900 rounded-full overflow-hidden flex border border-gray-800">
              <div style="width: ${pctA}%" class="h-full bg-blue-600 transition-all duration-300"></div>
              <div style="width: ${pctB}%" class="h-full bg-red-600 transition-all duration-300"></div>
            </div>

            <div class="flex justify-between items-center pt-1 text-xs">
              <span class="text-gray-500">총 ${total}명 투표</span>
              ${voted 
                ? `<span class="text-gray-400 font-bold bg-gray-800 px-3 py-1 rounded-lg">✓ 투표 완료 (${userChoice.toUpperCase()})</span>`
                : `<span class="text-blue-400 font-bold">카드를 클릭해 투표하세요</span>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    // 페이지 로드 시 초기 실행
    loadPoll();
    loadHeroComments();
    renderCustomMatches();
  </script>
</body>
</html>
