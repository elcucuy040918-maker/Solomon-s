<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOMON'S - 스포츠 토론 & 실시간 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#3B82F6', accent: '#EF4444', darkbg: '#0A0D14', cardbg: '#121722' },
          fontFamily: { sports: ['Oswald', 'Noto Sans KR', 'sans-serif'], sans: ['Noto Sans KR', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .font-sports-title { font-family: 'Oswald', 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body class="bg-[#0A0D14] text-gray-100 min-h-screen font-sans antialiased">

  <!-- 상단 네비게이션 -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0A0D14]/90 border-b border-gray-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='index.html'">
        <span class="font-sports-title text-3xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-red-500 uppercase">
          SOLOMON'S
        </span>
        <span class="bg-red-500/20 text-red-400 text-xs font-black px-2.5 py-0.5 rounded-full border border-red-500/40 animate-pulse tracking-wider">
          LIVE VOTE
        </span>
      </div>
      <nav class="flex items-center space-x-4 text-sm font-bold uppercase tracking-wider">
        <button onclick="openModal()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-black px-3.5 py-2 rounded-xl border border-blue-400/30 transition flex items-center gap-1.5 shadow-lg shadow-blue-500/20">
          <i class="fa-solid fa-plus"></i> 토론 주제 추가
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">

    <!-- 메인 핫 토론 매치 (클릭 시 detail.html로 이동) -->
    <section onclick="location.href='detail.html?id=main'" class="relative rounded-3xl overflow-hidden border border-gray-800/80 bg-[#121722] hover:border-blue-500/50 transition cursor-pointer shadow-2xl p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <span class="text-xs font-black uppercase tracking-widest text-red-400 bg-red-950/80 px-3 py-1 rounded-full border border-red-800/60 inline-flex items-center gap-1.5">
            <i class="fa-solid fa-fire"></i> 오늘 가장 뜨거운 메인 매치 (클릭하여 참여)
          </span>
          <h1 class="text-2xl md:text-4xl font-black mt-2 tracking-tight italic">2020년대 최고의 프리미어리그 윙어는?</h1>
        </div>
        <div class="text-xs text-blue-400 font-bold bg-blue-950/80 px-4 py-2 rounded-xl border border-blue-800 w-fit">
          투표 & 토론 참여하기 →
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
        <div class="h-64 rounded-2xl overflow-hidden relative border border-gray-800">
          <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=900&q=80" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
          <div class="absolute bottom-4 left-4"><span class="text-xs text-blue-400 font-bold">토트넘</span><h3 class="text-2xl font-black">손흥민</h3></div>
        </div>
        <div class="h-64 rounded-2xl overflow-hidden relative border border-gray-800">
          <img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=900&q=80" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
          <div class="absolute bottom-4 left-4"><span class="text-xs text-red-400 font-bold">리버풀</span><h3 class="text-2xl font-black">모하메드 살라</h3></div>
        </div>
      </div>
    </section>

    <!-- 전체 매치 목록 -->
    <section>
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-black italic tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-bolt text-yellow-500"></i> 진행 중인 매치 토론 목록
        </h2>
        <span class="text-xs text-gray-400">원하는 토론 카드를 클릭하여 투표 및 댓글에 참여하세요</span>
      </div>

      <div id="match-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>
  </main>

  <!-- 주제 추가 모달 -->
  <div id="create-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#121722] border border-gray-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 class="text-xl font-black italic text-white flex items-center gap-2">
          <i class="fa-solid fa-square-plus text-blue-500"></i> 새 토론 주제 추가
        </h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
      </div>

      <form onsubmit="handleCreateMatch(event)" class="space-y-4 text-xs">
        <div>
          <label class="block text-gray-400 font-bold mb-1">토론 제목</label>
          <input type="text" id="modal-title" placeholder="예: GOAT 논쟁 - 메시 vs 호날두" required class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
        </div>

        <div class="p-3 bg-blue-950/30 border border-blue-900/50 rounded-xl space-y-2">
          <span class="font-bold text-blue-400 block">선택지 A</span>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="modal-a-name" placeholder="이름 (예: 메시)" required class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
            <input type="text" id="modal-a-team" placeholder="팀 (예: 인터 마이애미)" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
          </div>
          <input type="url" id="modal-a-img" placeholder="이미지 URL (선택)" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
        </div>

        <div class="p-3 bg-red-950/30 border border-red-900/50 rounded-xl space-y-2">
          <span class="font-bold text-red-400 block">선택지 B</span>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="modal-b-name" placeholder="이름 (예: 호날두)" required class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
            <input type="text" id="modal-b-team" placeholder="팀 (예: 알 나스르)" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
          </div>
          <input type="url" id="modal-b-img" placeholder="이미지 URL (선택)" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-gray-800 text-gray-300 font-bold">취소</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 text-white font-black">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    function getCustomMatches() { const saved = localStorage.getItem('custom_matches'); return saved ? JSON.parse(saved) : []; }
    function openModal() { document.getElementById('create-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('create-modal').classList.add('hidden'); }

    function handleCreateMatch(e) {
      e.preventDefault();
      const title = document.getElementById('modal-title').value.trim();
      const aName = document.getElementById('modal-a-name').value.trim();
      const aTeam = document.getElementById('modal-a-team').value.trim() || 'A팀';
      const aImg = document.getElementById('modal-a-img').value.trim() || 'https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=600&q=80';
      const bName = document.getElementById('modal-b-name').value.trim();
      const bTeam = document.getElementById('modal-b-team').value.trim() || 'B팀';
      const bImg = document.getElementById('modal-b-img').value.trim() || 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=600&q=80';

      const newMatch = {
        id: `match_${Date.now()}`,
        title,
        optionA: { name: aName, team: aTeam, img: aImg, votes: 0 },
        optionB: { name: bName, team: bTeam, img: bImg, votes: 0 }
      };

      const list = getCustomMatches();
      list.unshift(newMatch);
      localStorage.setItem('custom_matches', JSON.stringify(list));

      closeModal();
      e.target.reset();
      renderCustomMatches();
    }

    function renderCustomMatches() {
      const container = document.getElementById('match-cards-container');
      const list = getCustomMatches();

      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full border border-dashed border-gray-800 rounded-2xl p-8 text-center text-gray-500"><p class="text-xs">상단의 + 버튼으로 첫 매치를 만들어보세요!</p></div>`;
        return;
      }

      container.innerHTML = list.map(m => `
        <div onclick="location.href='detail.html?id=${m.id}'" class="bg-[#121722] border border-gray-800 hover:border-blue-500/80 rounded-2xl p-5 shadow-lg flex flex-col justify-between space-y-4 cursor-pointer transition">
          <h3 class="text-lg font-black italic text-white">${escapeHtml(m.title)}</h3>
          <div class="grid grid-cols-2 gap-3">
            <div class="h-28 rounded-xl overflow-hidden relative">
              <img src="${escapeHtml(m.optionA.img)}" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-black/40"></div>
              <p class="absolute bottom-2 left-2 text-xs font-bold text-white">${escapeHtml(m.optionA.name)}</p>
            </div>
            <div class="h-28 rounded-xl overflow-hidden relative">
              <img src="${escapeHtml(m.optionB.img)}" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-black/40"></div>
              <p class="absolute bottom-2 left-2 text-xs font-bold text-white">${escapeHtml(m.optionB.name)}</p>
            </div>
          </div>
          <div class="flex justify-between items-center text-xs text-blue-400 font-bold border-t border-gray-800/80 pt-2">
            <span>총 ${m.optionA.votes + m.optionB.votes}명 참여 중</span>
            <span>입장하여 투표하기 →</span>
          </div>
        </div>
      `).join('');
    }

    renderCustomMatches();
  </script>
</body>
</html>
