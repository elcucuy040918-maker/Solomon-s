<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOMON'S - 스포츠 토론 & 실시간 투표</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#3B82F6',
            accent: '#EF4444',
            darkbg: '#0A0D14',
            cardbg: '#121722',
          },
          fontFamily: {
            sports: ['Oswald', 'Noto Sans KR', 'sans-serif'],
            sans: ['Noto Sans KR', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .font-sports-title { font-family: 'Oswald', 'Noto Sans KR', sans-serif; }
    .vote-bar-transition { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="bg-[#0A0D14] text-gray-100 min-h-screen font-sans antialiased">

  <!-- 상단 네비게이션 -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0A0D14]/90 border-b border-gray-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="font-sports-title text-3xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-indigo-400 to-red-500 uppercase">
          SOLOMON'S
        </span>
        <span class="bg-red-500/20 text-red-400 text-xs font-black px-2.5 py-0.5 rounded-full border border-red-500/40 animate-pulse tracking-wider">
          LIVE VOTE
        </span>
      </div>
      <nav class="flex items-center space-x-6 text-sm font-bold uppercase tracking-wider">
        <a href="#hero-debate" class="text-blue-400 border-b-2 border-blue-500 pb-1">핫 토론 매치</a>
        <a href="#all-matches" class="text-gray-400 hover:text-white transition">전체 투표</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">

    <!-- 1. 메인 히어로 매치 (가장 뜨거운 토론) -->
    <section id="hero-debate" class="relative rounded-3xl overflow-hidden border border-gray-800/80 bg-[#121722] shadow-2xl p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <span class="text-xs font-black uppercase tracking-widest text-red-400 bg-red-950/80 px-3 py-1 rounded-full border border-red-800/60 inline-flex items-center gap-1.5">
            <i class="fa-solid fa-fire"></i> 오늘 가장 뜨거운 매치
          </span>
          <h1 class="text-2xl md:text-4xl font-black mt-2 tracking-tight italic">2020년대 최고의 프리미어리그 윙어는?</h1>
        </div>
        <div id="hero-total-badge" class="text-xs text-gray-400 bg-gray-900/90 px-3.5 py-2 rounded-xl border border-gray-800 w-fit">
          총 투표수: <span id="hero-total-votes" class="font-sports-title text-lg font-bold text-white ml-1">0</span>표
        </div>
      </div>

      <!-- 양자 대결 카드 그리드 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
        <div class="hidden md:flex absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-14 h-14 rounded-full bg-[#0A0D14] border-2 border-yellow-500/80 items-center justify-center font-sports-title font-black italic text-xl text-yellow-400 shadow-2xl shadow-yellow-500/20">
          VS
        </div>

        <!-- 옵션 A: 손흥민 -->
        <div id="hero-card-a" class="group relative rounded-2xl overflow-hidden border-2 border-gray-800/80 hover:border-blue-500/80 transition-all duration-300 bg-gray-900 flex flex-col justify-between">
          <div class="h-80 w-full overflow-hidden relative cursor-pointer" onclick="handleHeroVote('a')">
            <img id="hero-img-a" src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=900&q=80" alt="손흥민" class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0A0D14] via-transparent to-black/30"></div>
            
            <label onclick="event.stopPropagation();" class="absolute top-3 right-3 bg-black/60 hover:bg-black/90 text-gray-300 text-xs px-2.5 py-1 rounded-lg border border-gray-700 transition flex items-center gap-1.5 backdrop-blur-sm z-10 cursor-pointer">
              <i class="fa-solid fa-camera"></i> 이미지 수정
              <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'hero-img-a')">
            </label>

            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-blue-400 bg-blue-950/90 px-2.5 py-0.5 rounded border border-blue-800">토트넘 홋스퍼</span>
                <h3 class="text-3xl font-black text-white mt-1 italic tracking-wide">손흥민</h3>
              </div>
              <span id="hero-pct-a" class="font-sports-title text-4xl font-black text-blue-400 tracking-wider">0%</span>
            </div>
          </div>
          <div class="p-4 bg-gray-950/90 flex items-center justify-between border-t border-gray-800">
            <span class="text-xs text-gray-400"><span id="hero-count-a" class="font-sports-title text-base font-bold text-gray-200">0</span>표</span>
            <button id="hero-btn-a" onclick="handleHeroVote('a')" class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider bg-blue-600 hover:bg-blue-500 text-white transition shadow-lg shadow-blue-600/30">
              선택 및 투표
            </button>
          </div>
        </div>

        <!-- 옵션 B: 모하메드 살라 -->
        <div id="hero-card-b" class="group relative rounded-2xl overflow-hidden border-2 border-gray-800/80 hover:border-red-500/80 transition-all duration-300 bg-gray-900 flex flex-col justify-between">
          <div class="h-80 w-full overflow-hidden relative cursor-pointer" onclick="handleHeroVote('b')">
            <img id="hero-img-b" src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=900&q=80" alt="모하메드 살라" class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0A0D14] via-transparent to-black/30"></div>
            
            <label onclick="event.stopPropagation();" class="absolute top-3 right-3 bg-black/60 hover:bg-black/90 text-gray-300 text-xs px-2.5 py-1 rounded-lg border border-gray-700 transition flex items-center gap-1.5 backdrop-blur-sm z-10 cursor-pointer">
              <i class="fa-solid fa-camera"></i> 이미지 수정
              <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'hero-img-b')">
            </label>

            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-red-400 bg-red-950/90 px-2.5 py-0.5 rounded border border-red-800">리버풀 FC</span>
                <h3 class="text-3xl font-black text-white mt-1 italic tracking-wide">모하메드 살라</h3>
              </div>
              <span id="hero-pct-b" class="font-sports-title text-4xl font-black text-red-400 tracking-wider">0%</span>
            </div>
          </div>
          <div class="p-4 bg-gray-950/90 flex items-center justify-between border-t border-gray-800">
            <span class="text-xs text-gray-400"><span id="hero-count-b" class="font-sports-title text-base font-bold text-gray-200">0</span>표</span>
            <button id="hero-btn-b" onclick="handleHeroVote('b')" class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider bg-red-600 hover:bg-red-500 text-white transition shadow-lg shadow-red-600/30">
              선택 및 투표
            </button>
          </div>
        </div>
      </div>

      <!-- 프로그레스 게이지 -->
      <div class="mt-6">
        <div class="flex justify-between text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">
          <span class="text-blue-400">손흥민 지지율</span>
          <span class="text-red-400">모하메드 살라 지지율</span>
        </div>
        <div class="w-full h-4 bg-gray-900 rounded-full overflow-hidden flex p-0.5 border border-gray-800">
          <div id="hero-bar-a" style="width: 50%" class="h-full bg-gradient-to-r from-blue-600 to-indigo-500 vote-bar-transition rounded-l-full"></div>
          <div id="hero-bar-b" style="width: 50%" class="h-full bg-gradient-to-r from-red-500 to-rose-600 vote-bar-transition rounded-r-full"></div>
        </div>
      </div>

      <!-- 메인 매치 댓글 섹션 -->
      <div class="mt-8 pt-6 border-t border-gray-800/80">
        <h3 class="text-lg font-bold mb-4 flex items-center gap-2 italic">
          <i class="fa-solid fa-comments text-blue-500"></i> 메인 토론 실시간 의견 (<span id="hero-comment-count" class="text-blue-400">0</span>)
        </h3>
        
        <form onsubmit="addHeroComment(event)" class="flex flex-col sm:flex-row gap-2 mb-6">
          <input type="text" id="hero-comment-author" placeholder="닉네임" required class="bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-3 py-2.5 sm:w-28 focus:outline-none focus:border-blue-500">
          <select id="hero-comment-side" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-500">
            <option value="SON">손흥민 지지</option>
            <option value="SALAH">살라 지지</option>
            <option value="NEUTRAL">중립/기타</option>
          </select>
          <input type="text" id="hero-comment-input" placeholder="이 매치에 대한 의견을 솔직하게 남겨주세요!" required class="flex-1 bg-gray-900 border border-gray-700 text-white text-xs rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 placeholder-gray-500">
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-black px-5 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 whitespace-nowrap">
            <i class="fa-solid fa-paper-plane"></i> 등록
          </button>
        </form>

        <div id="hero-comments-list" class="space-y-2.5 max-h-60 overflow-y-auto pr-2"></div>
      </div>
    </section>

    <!-- 2. 서브 핫 토론 카드 리스트 -->
    <section id="all-matches">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-black italic tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-bolt text-yellow-500"></i> 진행 중인 매치 토론 & 투표
        </h2>
        <span class="text-xs text-gray-400">카드를 클릭해 투표 및 댓글을 남겨보세요</span>
      </div>

      <div id="match-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>
  </main>

  <script>
    const PAGE_ID = 'main';

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // 1. D1 데이터베이스 연동: 투표 로딩 및 투표 실행
    async function loadPoll() {
      try {
        const res = await fetch(`/api/poll?id=${PAGE_ID}`);
        const poll = await res.json();
        updateHeroUI(poll.option_a || 0, poll.option_b || 0);
      } catch (err) {
        console.error('투표 데이터 로드 실패:', err);
      }
    }

    async function handleHeroVote(option) {
      try {
        await fetch('/api/poll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: PAGE_ID, option })
        });
        loadPoll();
      } catch (err) {
        alert('투표 등록 실패');
      }
    }

    function updateHeroUI(votesA, votesB) {
      const total = votesA + votesB;
      const pctA = total === 0 ? 0 : Math.round((votesA / total) * 100);
      const pctB = total === 0 ? 0 : 100 - pctA;

      document.getElementById('hero-total-votes').innerText = total.toLocaleString();
      document.getElementById('hero-count-a').innerText = votesA.toLocaleString();
      document.getElementById('hero-count-b').innerText = votesB.toLocaleString();
      document.getElementById('hero-pct-a').innerText = `${pctA}%`;
      document.getElementById('hero-pct-b').innerText = `${pctB}%`;

      document.getElementById('hero-bar-a').style.width = `${total === 0 ? 50 : pctA}%`;
      document.getElementById('hero-bar-b').style.width = `${total === 0 ? 50 : pctB}%`;
    }

    // 2. D1 데이터베이스 연동: 댓글 로딩 및 등록
    async function loadHeroComments() {
      try {
        const res = await fetch(`/api/comments?page_id=${PAGE_ID}`);
        const comments = await res.json();
        renderHeroComments(comments);
      } catch (err) {
        console.error('댓글 로드 실패:', err);
      }
    }

    async function addHeroComment(e) {
      e.preventDefault();
      const author = document.getElementById('hero-comment-author').value.trim();
      const side = document.getElementById('hero-comment-side').value;
      const text = document.getElementById('hero-comment-input').value.trim();

      if (!author || !text) return alert('닉네임과 의견을 입력해주세요.');

      const contentPayload = `[${side}] ${text}`;

      await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_id: PAGE_ID, author: author, content: contentPayload })
      });

      document.getElementById('hero-comment-input').value = '';
      loadHeroComments();
    }

    function renderHeroComments(comments) {
      const container = document.getElementById('hero-comments-list');
      document.getElementById('hero-comment-count').innerText = comments.length;

      if (!comments || comments.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 italic py-2">아직 댓글이 없습니다. 첫 의견을 작성해보세요!</p>`;
        return;
      }

      container.innerHTML = comments.map(c => {
        let sideText = '중립';
        let badgeClass = 'bg-gray-800 text-gray-300 border-gray-700';
        let displayContent = c.content;

        if (c.content.startsWith('[SON]')) {
          sideText = '손흥민 지지';
          badgeClass = 'bg-blue-950/80 text-blue-400 border-blue-800';
          displayContent = c.content.replace('[SON] ', '');
        } else if (c.content.startsWith('[SALAH]')) {
          sideText = '살라 지지';
          badgeClass = 'bg-red-950/80 text-red-400 border-red-800';
          displayContent = c.content.replace('[SALAH] ', '');
        } else if (c.content.startsWith('[NEUTRAL]')) {
          displayContent = c.content.replace('[NEUTRAL] ', '');
        }

        return `
          <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-3 flex justify-between items-start gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-blue-400">${escapeHtml(c.author)}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${badgeClass}">${sideText}</span>
                <span class="text-[11px] text-gray-500">${c.created_at || ''}</span>
              </div>
              <p class="text-xs text-gray-200">${escapeHtml(displayContent)}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    // 3. R2 연동: 이미지 직접 파일 선택 업로드
    async function uploadImage(event, targetImgId) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.url) {
          document.getElementById(targetImgId).src = data.url;
          alert('이미지가 R2 서버로 업로드 및 변경되었습니다!');
        }
      } catch (err) {
        alert('이미지 업로드에 실패했습니다.');
      }
    }

    // 초기 실행
    loadPoll();
    loadHeroComments();
  </script>
</body>
</html>
